<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  [data-burger]{display:none}
  @media(max-width:1180px){[data-nav]{gap:18px!important;margin-left:16px!important}[data-nav] a{font-size:17px!important}[data-hdr]{gap:20px!important;height:78px!important;padding:0 24px!important}[data-hdr] img{height:38px!important}[data-navcta] a{font-size:15.5px!important;padding:13px 20px!important}}
  @media(max-width:1060px){[data-nav],[data-navcta]{display:none!important}[data-burger]{display:flex!important}}
  @media(max-width:640px){[data-hdr]{padding:0 20px!important}}
</style>
</helmet>
<div>
  <a href="#inhalt" style="position:absolute;left:-9999px;top:0;z-index:100;background:#006378;color:#fff;font-size:15px;font-weight:600;padding:14px 22px;border-radius:0 0 12px 0" style-focus="left:0">Direkt zum Inhalt</a>
  <header style="position:sticky;top:0;z-index:60;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid #EDF1F2">
    <div data-hdr style="max-width:1240px;margin:0 auto;padding:0 32px;height:80px;display:flex;align-items:center;gap:30px">
      <a href="./index.html" aria-label="PIATO HEALTH – zur Startseite" style="display:flex;align-items:center;flex:0 0 auto"><img src="assets/piato-logo.png" alt="PIATO HEALTH" width="164" height="43" style="height:43px;width:auto;display:block"></a>
      <nav data-nav aria-label="Hauptnavigation" style="margin-left:36px;display:flex;align-items:center;justify-content:flex-end;gap:28px;flex:1 1 auto">
        <a href="./index.html" aria-current="{{ curHome }}" style="font-size:19px;line-height:1.2;white-space:nowrap;color:{{ cHome }};font-weight:{{ wHome }};padding:6px 0 4px;border-bottom:2px solid {{ bHome }};transition:color .2s ease,border-color .2s ease" style-hover="color:#007C96">Start</a>
        <a href="./pflegeruf.html" aria-current="{{ curProd }}" style="font-size:19px;line-height:1.2;white-space:nowrap;color:{{ cProd }};font-weight:{{ wProd }};padding:6px 0 4px;border-bottom:2px solid {{ bProd }};transition:color .2s ease,border-color .2s ease" style-hover="color:#007C96">Pflegeruf</a>
        <a href="./einsatzbereiche.html" aria-current="{{ curEin }}" style="font-size:19px;line-height:1.2;white-space:nowrap;color:{{ cEin }};font-weight:{{ wEin }};padding:6px 0 4px;border-bottom:2px solid {{ bEin }};transition:color .2s ease,border-color .2s ease" style-hover="color:#007C96">Einsatzbereiche</a>
        <a href="./about.html" aria-current="{{ curAbout }}" style="font-size:19px;line-height:1.2;white-space:nowrap;color:{{ cAbout }};font-weight:{{ wAbout }};padding:6px 0 4px;border-bottom:2px solid {{ bAbout }};transition:color .2s ease,border-color .2s ease" style-hover="color:#007C96">About PIATO</a>
      </nav>
      <div data-navcta style="display:flex;align-items:center;flex:0 0 auto">
        <a href="./impressum.html#kontakt" style="display:inline-flex;align-items:center;gap:10px;font-family:inherit;font-size:16.5px;line-height:1.2;white-space:nowrap;font-weight:600;color:#fff;background:#006378;border:0;padding:15px 28px;border-radius:999px;transition:background .2s ease,transform .2s ease,box-shadow .2s ease" style-hover="background:#00485A;color:#fff;transform:translateY(-1px);box-shadow:0 12px 24px -14px rgba(0,60,75,.7)">Kontakt aufnehmen</a>
      </div>
      <button type="button" data-burger aria-label="{{ menuLabel }}" aria-expanded="{{ menuExpanded }}" aria-controls="piato-mobile-nav" onClick="{{ toggleMenu }}" style="margin-left:auto;align-items:center;justify-content:center;width:48px;height:48px;border:1px solid #DFE3E5;border-radius:14px;background:#fff;color:#007C96;cursor:pointer;transition:border-color .2s ease,color .2s ease" style-hover="border-color:#007C96;color:#007C96">
        <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
        </sc-if>
        <sc-if value="{{ menuClosed }}" hint-placeholder-val="{{ true }}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>
        </sc-if>
      </button>
    </div>
    <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
      <nav id="piato-mobile-nav" aria-label="Hauptnavigation mobil" style="border-top:1px solid #EDF1F2;background:#fff;padding:18px 20px 24px;display:grid;gap:4px">
        <a href="./index.html" aria-current="{{ curHome }}" style="padding:15px 12px;font-size:17.5px;line-height:1.3;font-weight:{{ wHome }};color:{{ cHome }};border-radius:12px" style-hover="background:#F5F7F8;color:#007C96">Start</a>
        <a href="./pflegeruf.html" aria-current="{{ curProd }}" style="padding:15px 12px;font-size:17.5px;line-height:1.3;font-weight:{{ wProd }};color:{{ cProd }};border-radius:12px" style-hover="background:#F5F7F8;color:#007C96">Pflegeruf</a>
        <a href="./einsatzbereiche.html" aria-current="{{ curEin }}" style="padding:15px 12px;font-size:17.5px;line-height:1.3;font-weight:{{ wEin }};color:{{ cEin }};border-radius:12px" style-hover="background:#F5F7F8;color:#007C96">Einsatzbereiche</a>
        <a href="./about.html" aria-current="{{ curAbout }}" style="padding:15px 12px;font-size:17.5px;line-height:1.3;font-weight:{{ wAbout }};color:{{ cAbout }};border-radius:12px" style-hover="background:#F5F7F8;color:#007C96">About PIATO</a>
        <a href="./impressum.html#kontakt" style="margin-top:12px;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:inherit;font-size:17px;font-weight:600;color:#fff;background:#006378;border:0;padding:15px 26px;border-radius:999px" style-hover="background:#00485A;color:#fff">Kontakt aufnehmen</a>
      </nav>
    </sc-if>
  </header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:80},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;pflegeruf&quot;,&quot;einsatzbereiche&quot;,&quot;about&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { menuOpen: false };

  componentDidMount() {
    this.onKey = (e) => {
      if (e.key === 'Escape' && this.state.menuOpen) this.setState({ menuOpen: false });
    };
    document.addEventListener('keydown', this.onKey);
  }

  componentWillUnmount() {
    document.removeEventListener('keydown', this.onKey);
  }

  renderVals() {
    const a = this.props.active || 'home';
    const keys = { home: 'Home', pflegeruf: 'Prod', einsatzbereiche: 'Ein', about: 'About' };
    const out = {
      menuOpen: this.state.menuOpen,
      menuClosed: !this.state.menuOpen,
      menuExpanded: this.state.menuOpen ? 'true' : 'false',
      menuLabel: this.state.menuOpen ? 'Menü schließen' : 'Menü öffnen',
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen }))
    };
    for (const k in keys) {
      const on = a === k, s = keys[k];
      out['c' + s] = on ? '#007C96' : '#00697F';
      out['w' + s] = on ? 600 : 500;
      out['b' + s] = on ? '#007C96' : 'transparent';
      out['cur' + s] = on ? 'page' : undefined;
    }
    return out;
  }
}
</script>
</body>
</html>
