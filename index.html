document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

order-radius:10px\" style-hover=\"background:#F5F7F8;color:#006378\">Technologie<\u002Fa>\n      <a href=\"kontakt.dc.html\" style=\"padding:12px 8px;font-size:16px;font-weight:500;color:#2B4249;border-radius:10px\" style-hover=\"background:#F5F7F8;color:#006378\">Kontakt<\u002Fa>\n      <a href=\"kontakt.dc.html\" style=\"margin-top:10px;text-align:center;font-size:16px;font-weight:600;color:#fff;background:#006378;padding:15px 26px;border-radius:999px\" style-hover=\"background:#00485A;color:#fff\">Demo vereinbaren<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fheader>\n\n<main>\n  <section data-screen-label=\"Hero\" data-split=\"\" style=\"max-width:1240px;margin:0 auto;padding:88px 32px 104px;display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:center\">\n    <div>\n      <span style=\"display:inline-block;background:#F0F5F6;color:#006378;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:11px 22px;border-radius:999px\">PIATO Pflegeruf<\u002Fspan>\n      <h1 style=\"margin:28px 0 0;font-size:clamp(36px,5.4vw,66px);line-height:1.06;letter-spacing:-.025em;font-weight:800;color:#006378;text-wrap:balance\">Pflege stärken.<br>Kommunikation vereinfachen.<\u002Fh1>\n      <p style=\"margin:28px 0 0;font-size:clamp(17px,1.5vw,19px);line-height:1.65;color:#5B6A70;max-width:520px;text-wrap:pretty\">PIATO Pflegeruf entlastet Pflegekräfte, macht Anliegen von Patient:innen sichtbar und schafft transparente Prozesse – für mehr Zeit am Menschen.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:16px;margin-top:38px\">\n        <a href=\"kontakt.dc.html\" style=\"display:inline-flex;align-items:center;gap:12px;background:#006378;color:#fff;font-size:16px;font-weight:600;padding:17px 32px;border-radius:999px;transition:background .2s ease,transform .2s ease\" style-hover=\"background:#00485A;color:#fff;transform:translateY(-2px)\">Demo vereinbaren\n          <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m12 5 7 7-7 7\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n        <a href=\"pflegeruf.dc.html\" style=\"display:inline-flex;align-items:center;background:#fff;color:#1F3A42;font-size:16px;font-weight:600;padding:17px 32px;border-radius:999px;border:1px solid #DFE3E5;transition:border-color .2s ease,color .2s ease,transform .2s ease\" style-hover=\"border-color:#006378;color:#006378;transform:translateY(-2px)\">Mehr über den Pflegeruf<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <img data-img=\"\" src=\"a96afbe0-90c8-4b8e-bdbf-22f8036a45c4\" alt=\"Smartphone mit der PIATO Pflegeruf App auf einem Nachttisch im Patientenzimmer\" style=\"width:100%;height:640px;object-fit:cover;border-radius:22px;box-shadow:0 24px 60px -24px rgba(0,40,50,.28)\">\n  <\u002Fsection>\n\n  <section data-screen-label=\"Mission\" style=\"max-width:1240px;margin:0 auto;padding:0 32px 104px\">\n    <div style=\"max-width:820px;margin:0 auto;text-align:center\">\n      <h2 style=\"font-size:clamp(28px,3.7vw,46px);line-height:1.14;letter-spacing:-.02em;font-weight:800;color:#006378;text-wrap:balance\">Pflege braucht Zeit – nicht Papier.<\u002Fh2>\n      <p style=\"margin-top:22px;font-size:clamp(17px,1.5vw,19px);line-height:1.65;color:#5B6A70;text-wrap:pretty\">PIATO Pflegeruf ermöglicht eine strukturierte Kommunikation zwischen Patient:innen und Pflegekräften. Effizient, transparent und menschlich.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Kennzahlen\" style=\"background:#F5F7F8\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:96px 32px\">\n      <div style=\"max-width:760px;margin:0 auto;text-align:center\">\n        <span style=\"display:inline-block;background:#fff;color:#006378;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:11px 22px;border-radius:999px\">Messbare Wirkung<\u002Fspan>\n        <h2 style=\"margin-top:26px;font-size:clamp(28px,3.7vw,46px);line-height:1.14;letter-spacing:-.02em;font-weight:800;color:#006378;text-wrap:balance\">Messbare Wirkung im Pflegealltag<\u002Fh2>\n        <p style=\"margin-top:22px;font-size:clamp(17px,1.5vw,19px);line-height:1.65;color:#5B6A70;text-wrap:pretty\">PIATO Pflegeruf verbessert nicht nur die Kommunikation, sondern wirkt direkt auf Abläufe, Zeit und Belastung im Alltag.<\u002Fp>\n      <\u002Fdiv>\n      <div data-grid=\"4\" style=\"margin-top:60px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px\">\n        <div style=\"background:#fff;border:1px solid #E7ECEE;border-radius:20px;padding:38px 30px;text-align:center;transition:transform .25s ease,box-shadow .25s ease\" style-hover=\"transform:translateY(-4px);box-shadow:0 18px 40px -22px rgba(0,60,75,.32)\">\n          <div style=\"font-size:clamp(26px,2.6vw,34px);font-weight:800;color:#006378;letter-spacing:-.02em\">bis zu 35 %<\u002Fdiv>\n          <p style=\"margin-top:12px;font-size:16px;line-height:1.55;color:#5B6A70\">weniger Laufwege im Pflegealltag<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #E7ECEE;border-radius:20px;padding:38px 30px;text-align:center;transition:transform .25s ease,box-shadow .25s ease\" style-hover=\"transform:translateY(-4px);box-shadow:0 18px 40px -22px rgba(0,60,75,.32)\">\n          <div style=\"font-size:clamp(26px,2.6vw,34px);font-weight:800;color:#006378;letter-spacing:-.02em\">ca. 6 Minuten<\u002Fdiv>\n          <p style=\"margin-top:12px;font-size:16px;line-height:1.55;color:#5B6A70\">Zeitersparnis pro Ruf<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #E7ECEE;border-radius:20px;padding:38px 30px;text-align:center;transition:transform .25s ease,box-shadow .25s ease\" style-hover=\"transform:translateY(-4px);box-shadow:0 18px 40px -22px rgba(0,60,75,.32)\">\n          <div style=\"font-size:clamp(26px,2.6vw,34px);font-weight:800;color:#006378;letter-spacing:-.02em\">klarere<\u002Fdiv>\n          <p style=\"margin-top:12px;font-size:16px;line-height:1.55;color:#5B6A70\">Priorisierung von Anliegen<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #E7ECEE;border-radius:20px;padding:38px 30px;text-align:center;transition:transform .25s ease,box-shadow .25s ease\" style-hover=\"transform:translateY(-4px);box-shadow:0 18px 40px -22px rgba(0,60,75,.32)\">\n          <div style=\"font-size:clamp(26px,2.6vw,34px);font-weight:800;color:#006378;letter-spacing:-.02em\">weniger<\u002Fdiv>\n          <p style=\"margin-top:12px;font-size:16px;line-height:1.55;color:#5B6A70\">Unterbrechungen im Pflegeprozess<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:36px auto 0;max-width:760px;text-align:center;font-size:16px;line-height:1.6;color:#7A868B\">Diese Effekte entstehen durch strukturierte, nachvollziehbare Kommunikation zwischen Patient:innen und Pflege.<\u002Fp>\n      <div style=\"margin-top:44px;text-align:center\">\n        <a href=\"pflegeruf.dc.html#wirkung\" style=\"display:inline-flex;align-items:center;gap:10px;font-size:16px;font-weight:600;color:#006378\" style-hover=\"color:#00485A\">Wirkung im Detail ansehen\n          <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m12 5 7 7-7 7\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Leistungen\" style=\"max-width:1240px;margin:0 auto;padding:104px 32px\">\n    <div style=\"max-width:760px;margin:0 auto;text-align:center\">\n      <span style=\"display:inline-block;background:#F0F5F6;color:#006378;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:11px 22px;border-radius:999px\">Funktionen<\u002Fspan>\n      <h2 style=\"margin-top:26px;font-size:clamp(28px,3.7vw,46px);line-height:1.14;letter-spacing:-.02em;font-weight:800;color:#006378;text-wrap:balance\">Was PIATO Pflegeruf ermöglicht<\u002Fh2>\n    <\u002Fdiv>\n    <div data-grid=\"3\" style=\"margin-top:56px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px\">\n      <article style=\"background:#fff;border:1px solid #E7ECEE;border-radius:22px;padding:36px;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease\" style-hover=\"transform:translateY(-4px);box-shadow:0 20px 44px -24px rgba(0,60,75,.34);border-color:#CFE0E4\">\n        <div style=\"width:52px;height:52px;border-radius:16px;background:#F0F5F6;display:flex;align-items:center;justify-content:center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#006378\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7.9 20A9 9 0 1 0 4 16.1L2 22Z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3 style=\"margin-top:24px;font-size:21px;font-weight:700;color:#1F3A42\">Direkte Rückmeldungen<\u002Fh3>\n        <p style=\"margin-top:12px;font-size:16px;line-height:1.62;color:#5B6A70;text-wrap:pretty\">Patient:innen teilen ihr Anliegen strukturiert und verständlich mit – statt unspezifischer Rufe.<\u002Fp>\n      <\u002Farticle>\n      <article style=\"background:#fff;border:1px solid #E7ECEE;border-radius:22px;padding:36px;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease\" style-hover=\"transform:translateY(-4px);box-shadow:0 20px 44px -24px rgba(0,60,75,.34);border-color:#CFE0E4\">\n        <div style=\"width:52px;height:52px;border-radius:16px;background:#F0F5F6;display:flex;align-items:center;justify-content:center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#006378\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21.801 10A10 10 0 1 1 17 3.335\"><\u002Fpath><path d=\"m9 11 3 3L22 4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3 style=\"margin-top:24px;font-size:21px;font-weight:700;color:#1F3A42\">Patient:innen erhalten Feedback<\u002Fh3>\n        <p style=\"margin-top:12px;font-size:16px;line-height:1.62;color:#5B6A70;text-wrap:pretty\">Ein sichtbarer Status zeigt: Das Anliegen ist angekommen und wird bearbeitet.<\u002Fp>\n      <\u002Farticle>\n      <article style=\"background:#fff;border:1px solid #E7ECEE;border-radius:22px;padding:36px;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease\" style-hover=\"transform:translateY(-4px);box-shadow:0 20px 44px -24px rgba(0,60,75,.34);border-color:#CFE0E4\">\n        <div style=\"width:52px;height:52px;border-radius:16px;background:#F0F5F6;display:flex;align-items:center;justify-content:center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#006378\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 6v6l4 2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3 style=\"margin-top:24px;font-size:21px;font-weight:700;color:#1F3A42\">Mehr Zeit für Pflege<\u002Fh3>\n        <p style=\"margin-top:12px;font-size:16px;line-height:1.62;color:#5B6A70;text-wrap:pretty\">Weniger Dokumentationsaufwand auf Papier, mehr echte Zuwendung am Menschen.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n    <div style=\"margin-top:44px;text-align:center\">\n      <a href=\"pflegeruf.dc.html#funktionen\" style=\"display:inline-flex;align-items:center;gap:10px;font-size:16px;font-weight:600;color:#006378\" style-hover=\"color:#00485A\">Alle Funktionen ansehen\n        <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m12 5 7 7-7 7\"><\u002Fpath><\u002Fsvg>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Stimmen\" style=\"background:#F5F7F8\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:104px 32px\">\n      <div style=\"max-width:760px;margin:0 auto;text-align:center\">\n        <span style=\"display:inline-block;background:#fff;color:#006378;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:11px 22px;border-radius:999px\">Erfahrungen<\u002Fspan>\n        <h2 style=\"margin-top:26px;font-size:clamp(28px,3.7vw,46px);line-height:1.14;letter-spacing:-.02em;font-weight:800;color:#006378;text-wrap:balance\">Erfahrungen mit dem PIATO Pflegeruf<\u002Fh2>\n      <\u002Fdiv>\n      <div data-grid=\"3\" style=\"margin-top:56px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px\">\n        <figure style=\"margin:0;background:#fff;border-radius:22px;padding:40px;display:flex;flex-direction:column;gap:22px\">\n          <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"#CBDDE1\"><path d=\"M9.5 5C6.5 6.7 5 9.4 5 13v6h6v-6H8.2c0-2.2.7-3.9 2.3-5zm9 0c-3 1.7-4.5 4.4-4.5 8v6h6v-6h-2.8c0-2.2.7-3.9 2.3-5z\"><\u002Fpath><\u002Fsvg>\n          <blockquote style=\"margin:0;font-size:19px;line-height:1.6;font-weight:600;color:#1F3A42;text-wrap:pretty\">„Endlich kann ich sagen, was ich brauche!“<\u002Fblockquote>\n          <figcaption style=\"margin-top:auto;font-size:15px;font-weight:600;color:#006378\">Patient<\u002Ffigcaption>\n        <\u002Ffigure>\n        <figure style=\"margin:0;background:#fff;border-radius:22px;padding:40px;display:flex;flex-direction:column;gap:22px\">\n          <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"#CBDDE1\"><path d=\"M9.5 5C6.5 6.7 5 9.4 5 13v6h6v-6H8.2c0-2.2.7-3.9 2.3-5zm9 0c-3 1.7-4.5 4.4-4.5 8v6h6v-6h-2.8c0-2.2.7-3.9 2.3-5z\"><\u002Fpath><\u002Fsvg>\n          <blockquote style=\"margin:0;font-size:19px;line-height:1.6;font-weight:600;color:#1F3A42;text-wrap:pretty\">„Wir sehen sofort, was wirklich dringend ist – das entspannt die Schicht.“<\u002Fblockquote>\n          <figcaption style=\"margin-top:auto;font-size:15px;font-weight:600;color:#006378\">Pflegefachkraft<\u002Ffigcaption>\n        <\u002Ffigure>\n        <figure style=\"margin:0;background:#fff;border-radius:22px;padding:40px;display:flex;flex-direction:column;gap:22px\">\n          <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"#CBDDE1\"><path d=\"M9.5 5C6.5 6.7 5 9.4 5 13v6h6v-6H8.2c0-2.2.7-3.9 2.3-5zm9 0c-3 1.7-4.5 4.4-4.5 8v6h6v-6h-2.8c0-2.2.7-3.9 2.3-5z\"><\u002Fpath><\u002Fsvg>\n          <blockquote style=\"margin:0;font-size:19px;line-height:1.6;font-weight:600;color:#1F3A42;text-wrap:pretty\">„Weniger unnötige Wege, mehr Zeit am Bett. Genau das brauchen wir.“<\u002Fblockquote>\n          <figcaption style=\"margin-top:auto;font-size:15px;font-weight:600;color:#006378\">Pflegeleitung<\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Seitenvorschau\" style=\"max-width:1240px;margin:0 auto;padding:104px 32px\">\n    <div data-grid=\"3\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:28px\">\n      <a href=\"pflegeruf.dc.html\" style=\"display:block;background:#fff;border:1px solid #E7ECEE;border-radius:22px;padding:36px;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease\" style-hover=\"transform:translateY(-4px);box-shadow:0 20px 44px -24px rgba(0,60,75,.34);border-color:#CFE0E4\">\n        <h3 style=\"font-size:21px;font-weight:700;color:#006378\">Pflegeruf<\u002Fh3>\n        <p style=\"margin-top:12px;font-size:16px;line-height:1.62;color:#5B6A70;text-wrap:pretty\">Wirkung, Funktionen und Ablauf des digitalen Pflegerufs im Detail.<\u002Fp>\n      <\u002Fa>\n      <a href=\"einsatzbereiche.dc.html\" style=\"display:block;background:#fff;border:1px solid #E7ECEE;border-radius:22px;padding:36px;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease\" style-hover=\"transform:translateY(-4px);box-shadow:0 20px 44px -24px rgba(0,60,75,.34);border-color:#CFE0E4\">\n        <h3 style=\"font-size:21px;font-weight:700;color:#006378\">Einsatzbereiche<\u002Fh3>\n        <p style=\"margin-top:12px;font-size:16px;line-height:1.62;color:#5B6A70;text-wrap:pretty\">Von der Klinik bis zur ambulanten Pflege – für jede Versorgungsform geeignet.<\u002Fp>\n      <\u002Fa>\n      <a href=\"technologie.dc.html\" style=\"display:block;background:#fff;border:1px solid #E7ECEE;border-radius:22px;padding:36px;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease\" style-hover=\"transform:translateY(-4px);box-shadow:0 20px 44px -24px rgba(0,60,75,.34);border-color:#CFE0E4\">\n        <h3 style=\"font-size:21px;font-weight:700;color:#006378\">Technologie &amp; Sicherheit<\u002Fh3>\n        <p style=\"margin-top:12px;font-size:16px;line-height:1.62;color:#5B6A70;text-wrap:pretty\">Entwickelt in Deutschland, betrieben nach europäischen Datenschutzstandards.<\u002Fp>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"CTA\" style=\"background:#04333E\">\n    <div style=\"max-width:900px;margin:0 auto;padding:96px 32px;text-align:center\">\n      <h2 style=\"font-size:clamp(28px,3.7vw,46px);line-height:1.14;letter-spacing:-.02em;font-weight:800;color:#fff;text-wrap:balance\">Pflegeruf live erleben<\u002Fh2>\n      <p style=\"margin-top:22px;font-size:clamp(17px,1.5vw,19px);line-height:1.65;color:#9FBAC1;text-wrap:pretty\">Wir zeigen Ihnen in einer persönlichen Demo, wie PIATO Pflegeruf in Ihrer Einrichtung funktioniert – inklusive Einführung, Schulung und Anbindung.<\u002Fp>\n      <a href=\"kontakt.dc.html\" style=\"display:inline-flex;align-items:center;gap:12px;margin-top:36px;background:#fff;color:#006378;font-size:16px;font-weight:600;padding:17px 32px;border-radius:999px;transition:transform .2s ease,background .2s ease\" style-hover=\"background:#EAF2F3;color:#00485A;transform:translateY(-2px)\">Demo vereinbaren\n        <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m12 5 7 7-7 7\"><\u002Fpath><\u002Fsvg>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fmain>\n\n<footer style=\"background:#04333E;color:#CFE0E4\">\n  <div data-footer=\"\" style=\"max-width:1240px;margin:0 auto;padding:80px 32px 40px;display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:56px\">\n    <div>\n      <img src=\"4e91ac20-9f3c-4d4a-b509-23bb2f05eaa2\" alt=\"PIATO HEALTH Logo\" loading=\"lazy\" style=\"height:34px;width:auto;display:block;filter:brightness(0) invert(1)\">\n      <p style=\"margin-top:22px;font-size:15px;line-height:1.7;color:#9FBAC1;max-width:360px;text-wrap:pretty\">Der digitale Pflegeruf für strukturierte Kommunikation zwischen Patient:innen und Pflege. Entwickelt in Deutschland – für Entlastung, Sicherheit und mehr Zeit am Menschen.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <h2 style=\"font-size:15px;font-weight:700;color:#fff;letter-spacing:.02em\">Pflegeruf<\u002Fh2>\n      <ul style=\"margin:18px 0 0;padding:0;list-style:none;display:grid;gap:12px\">\n        <li><a href=\"pflegeruf.dc.html#funktionen\" style=\"font-size:15px;color:#9FBAC1\" style-hover=\"color:#fff\">Funktionen<\u002Fa><\u002Fli>\n        <li><a href=\"pflegeruf.dc.html#wirkung\" style=\"font-size:15px;color:#9FBAC1\" style-hover=\"color:#fff\">Wirkung im Alltag<\u002Fa><\u002Fli>\n        <li><a href=\"pflegeruf.dc.html#ablauf\" style=\"font-size:15px;color:#9FBAC1\" style-hover=\"color:#fff\">Ablauf<\u002Fa><\u002Fli>\n        <li><a href=\"technologie.dc.html\" style=\"font-size:15px;color:#9FBAC1\" style-hover=\"color:#fff\">Technologie<\u002Fa><\u002Fli>\n        <li><a href=\"kontakt.dc.html\" style=\"font-size:15px;color:#9FBAC1\" style-h
