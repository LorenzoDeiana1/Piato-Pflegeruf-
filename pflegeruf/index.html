  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"723b2ec1-5e8e-4738-92d4-ee97480ec144\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<title>Pflegeruf neu gedacht – digitaler Pflegeruf von PIATO<\u002Ftitle>\n<meta name=\"description\" content=\"Der digitale Pflegeruf von PIATO: Anliegen strukturiert erfassen, priorisiert weitergeben und nachvollziehbar abschließen – mit mobiler Kommunikation für das Pflegeteam.\">\n<meta name=\"robots\" content=\"index,follow\">\n<script src=\"fc1b20ec-286f-4ad6-af9c-7d64c0677435\"><\u002Fscript>\n<style>\n  *{box-sizing:border-box}\n  html{scroll-behavior:smooth}\n  body{margin:0;font-family:Figtree,'Segoe UI',system-ui,sans-serif;color:#1F3A42;background:#fff;-webkit-font-smoothing:antialiased}\n  html[data-no-webfont] body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif}\n  a{color:#006378;text-decoration:none}\n  a:hover{color:#00485A}\n  h1,h2,h3,h4,p,ul,figure,blockquote{margin:0}\n  ul{padding:0;list-style:none}\n  :focus-visible{outline:3px solid #006378;outline-offset:3px}\n  html[data-reveal-ready] [data-reveal]{opacity:0;transform:translateY(20px)}\n  html[data-reveal-ready] [data-reveal][data-shown]{opacity:1;transform:none;transition:opacity .75s cubic-bezier(.2,.7,.2,1),transform .75s cubic-bezier(.2,.7,.2,1)}\n  @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}html[data-reveal-ready] [data-reveal]{opacity:1;transform:none}}\n  @media(max-width:1024px){\n    [data-split]{grid-template-columns:1fr!important;gap:44px!important}\n    [data-grid=\"4\"],[data-grid=\"3\"]{grid-template-columns:repeat(2,1fr)!important}\n    [data-img]{height:auto!important;aspect-ratio:4/3}\n  }\n  @media(max-width:640px){\n    [data-grid]{grid-template-columns:1fr!important}\n    main>section{padding:64px 20px!important}\n    main>section>div{padding:64px 20px!important}\n    [data-pad]{padding:44px 24px!important}\n    [data-img]{aspect-ratio:3/2}\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n<dc-import name=\"SiteHeader\" active=\"pflegeruf\" hint-size=\"100%,78px\"><\u002Fdc-import>\n\n<main id=\"inhalt\">\n  <section data-screen-label=\"Seiten-Hero\" style=\"max-width:1240px;margin:0 auto;padding:56px 32px 72px\">\n    <nav aria-label=\"Breadcrumb\" style=\"display:flex;align-items:center;gap:10px;font-size:14px;color:#8FA3A9\">\n      <a href=\"../\" style=\"color:#8FA3A9\" style-hover=\"color:#006378\">Start<\u002Fa>\n      <span aria-hidden=\"true\">/<\u002Fspan>\n      <span style=\"color:#1F3A42;font-weight:600\">Pflegeruf<\u002Fspan>\n    <\u002Fnav>\n    <div data-reveal=\"\" style=\"margin-top:34px;max-width:820px\">\n      <span style=\"display:inline-block;background:#F0F5F6;color:#006378;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:11px 22px;border-radius:999px\">PIATO Pflegeruf<\u002Fspan>\n      <h1 style=\"margin:26px 0 0;font-size:clamp(34px,4.6vw,58px);line-height:1.08;letter-spacing:-.025em;font-weight:800;color:#006378;text-wrap:balance\">Pflegeruf neu gedacht.<\u002Fh1>\n      <p style=\"margin:24px 0 0;font-size:clamp(17px,1.5vw,19px);line-height:1.65;color:#5B6A70;text-wrap:pretty\">PIATO Pflegeruf ermöglicht eine strukturierte Kommunikation zwischen Patient:innen und Pflegekräften. Effizient, transparent und menschlich.<\u002Fp>\n    <\u002Fdiv>\n    <div data-grid=\"2\" data-reveal=\"\" data-reveal-delay=\"120\" style=\"margin-top:52px;display:grid;grid-template-columns:1fr 1fr;gap:28px\">\n      <img data-img=\"\" src=\"32dbe088-3eab-4bff-a566-3d6824480e48\" alt=\"Pflegekraft hält die Hand einer älteren Patientin im Krankenzimmer\" width=\"580\" height=\"420\" loading=\"lazy\" style=\"width:100%;height:420px;object-fit:cover;border-radius:22px\">\n      <img data-img=\"\" src=\"816a64ea-a531-47a7-bf55-d0d4200c2b41\" alt=\"Patient bedient die Kachelansicht der PIATO Pflegeruf App\" width=\"580\" height=\"420\" loading=\"lazy\" style=\"width:100%;height:420px;object-fit:cover;border-radius:22px\">\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"was-ist\" data-screen-label=\"Was ist Pflegeruf\" style=\"background:#F5F7F8\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:100px 32px\">\n      <div data-reveal=\"\" style=\"max-width:820px;margin:0 auto;text-align:center\">\n        <span style=\"display:inline-block;background:#fff;color:#006378;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:11px 22px;border-radius:999px\">Was ist PIATO Pflegeruf?<\u002Fspan>\n        <h2 style=\"margin-top:26px;font-size:clamp(28px,3.7vw,46px);line-height:1.14;letter-spacing:-.02em;font-weight:800;color:#006378;text-wrap:balance\">Pflege braucht Zeit – nicht Papier.<\u002Fh2>\n        <p style=\"margin-top:22px;font-size:clamp(17px,1.5vw,19px);line-height:1.65;color:#5B6A70;text-wrap:pretty\">Patient:innen benennen ihr Anliegen selbst, statt einen unspezifischen Ruf abzugeben. Der Ruf erreicht das Pflegeteam priorisiert, kann gezielt weitergegeben und nachvollziehbar abgeschlossen werden.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"kommunikation\" data-screen-label=\"Kommunikation\" style=\"max-width:1240px;margin:0 auto;padding:104px 32px\">\n    <div data-reveal=\"\" style=\"max-width:760px;margin:0 auto;text-align:center\">\n      <span style=\"display:inline-block;background:#F0F5F6;color:#006378;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:11px 22px;border-radius:999px\">Ablauf<\u002Fspan>\n      <h2 style=\"margin-top:26px;font-size:clamp(28px,3.7vw,46px);line-height:1.14;letter-spacing:-.02em;font-weight:800;color:#006378;text-wrap:balance\">Kommunikation zwischen Patient und Pflege<\u002Fh2>\n      <p style=\"margin-top:22px;font-size:clamp(17px,1.5vw,19px);line-height:1.65;color:#5B6A70;text-wrap:pretty\">In drei Schritten von einem einfachen Ruf zu strukturierter Versorgung.<\u002Fp>\n    <\u002Fdiv>\n    <div data-grid=\"3\" style=\"margin-top:56px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px\">\n      <article data-reveal=\"\" style=\"background:#fff;border:1px solid #E7ECEE;border-radius:22px;padding:40px;transition:transform .25s ease,box-shadow .25s ease\" style-hover=\"transform:translateY(-5px);box-shadow:0 22px 46px -24px rgba(0,60,75,.34)\">\n        <span style=\"font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8FA3A9\">Schritt 01<\u002Fspan>\n        <h3 style=\"margin-top:16px;font-size:23px;font-weight:700;color:#006378\">Anliegen auswählen<\u002Fh3>\n        <p style=\"margin-top:14px;font-size:16px;line-height:1.62;color:#5B6A70;text-wrap:pretty\">Patient:innen wählen ihr Anliegen über große, verständliche Kacheln – Toilette, Schmerz, Durst, Infusion oder Sonstiges.<\u002Fp>\n      <\u002Farticle>\n      <article data-reveal=\"\" data-reveal-delay=\"110\" style=\"background:#fff;border:1px solid #E7ECEE;border-radius:22px;padding:40px;transition:transform .25s ease,box-shadow .25s ease\" style-hover=\"transform:translateY(-5px);box-shadow:0 22px 46px -24px rgba(0,60,75,.34)\">\n        <span style=\"font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8FA3A9\">Schritt 02<\u002Fspan>\n        <h3 style=\"margin-top:16px;font-size:23px;font-weight:700;color:#006378\">Ruf strukturiert weiterleiten<\u002Fh3>\n        <p style=\"margin-top:14px;font-size:16px;line-height:1.62;color:#5B6A70;text-wrap:pretty\">Der Ruf erscheint priorisiert im Pflegeteam und kann gezielt an die passende Person weitergegeben werden.<\u002Fp>\n      <\u002Farticle>\n      <article data-reveal=\"\" data-reveal-delay=\"220\" style=\"background:#fff;border:1px solid #E7ECEE;border-radius:22px;padding:40px;transition:transform .25s ease,box-shadow .25s ease\" style-hover=\"transform:translateY(-5px);box-shadow:0 22px 46px -24px rgba(0,60,75,.34)\">\n        <span style=\"font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8FA3A9\">Schritt 03<\u002Fspan>\n        <h3 style=\"margin-top:16px;font-size:23px;font-weight:700;color:#006378\">Transparent abschließen<\u002Fh3>\n        <p style=\"margin-top:14px;font-size:16px;line-height:1.62;color:#5B6A70;text-wrap:pretty\">Bearbeitung und Abschluss sind für alle nachvollziehbar – lückenlos dokumentiert und auswertbar.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"mobil\" data-screen-label=\"Mobile Kommunikation\" style=\"background:#F5F7F8\">\n    <div data-split=\"\" style=\"max-width:1240px;margin:0 auto;padding:100px 32px;display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:center\">\n      <div data-reveal=\"\">\n        <span style=\"display:inline-block;background:#fff;color:#006378;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:11px 22px;border-radius:999px\">Mobile Kommunikation<\u002Fspan>\n        <h2 style=\"margin-top:26px;font-size:clamp(28px,3.7vw,44px);line-height:1.14;letter-spacing:-.02em;font-weight:800;color:#006378;text-wrap:balance\">Dort verfügbar, wo gepflegt wird<\u002Fh2>\n        <p style=\"margin-top:22px;font-size:clamp(17px,1.5vw,19px);line-height:1.65;color:#5B6A70;text-wrap:pretty\">Mit der App PIATO Pflege sehen Pflegekräfte offene Anliegen priorisiert, bearbeiten sie und melden zurück – direkt in der Schicht. Patient:innen nutzen PIATO Patient, um ihr Anliegen mitzuteilen und den Bearbeitungsstatus zu verfolgen.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:16px;margin-top:32px\">\n          <button type=\"button\" data-app-cta=\"\" aria-haspopup=\"dialog\" style=\"min-height:52px;display:inline-flex;align-items:center;gap:12px;background:#006378;color:#fff;font-family:inherit;font-size:16px;font-weight:600;border:0;padding:17px 32px;border-radius:999px;cursor:pointer;transition:background .2s ease,transform .2s ease\" style-hover=\"background:#00485A;color:#fff;transform:translateY(-2px)\">App downloaden\n            <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v12\"><\u002Fpath><path d=\"m7 10 5 5 5-5\"><\u002Fpath><path d=\"M4 21h16\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-grid=\"2\" data-reveal=\"\" data-reveal-delay=\"120\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n        <div style=\"background:#fff;border:1px solid #E7ECEE;border-radius:20px;padding:30px\">\n          <div style=\"width:48px;height:48px;border-radius:14px;background:#F0F5F6;display:flex;align-items:center;justify-content:center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#006378\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\u002Fcircle><path d=\"M5.5 21a7 7 0 0 1 13 0\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <h3 style=\"margin-top:18px;font-size:18px;font-weight:700;color:#1F3A42\">PIATO Patient<\u002Fh3>\n          <p style=\"margin-top:8px;font-size:15px;line-height:1.6;color:#5B6A70;text-wrap:pretty\">Anliegen mitteilen, Status verfolgen.<\u002Fp>\n          <a href=\"https://apps.apple.com/de/app/piato-patient/id1632008986\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"margin-top:16px;display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:#006378\" style-hover=\"color:#00485A\">Im App Store laden\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m12 5 7 7-7 7\"><\u002Fpath><\u002Fsvg>\n          <\u002Fa>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #E7ECEE;border-radius:20px;padding:30px\">\n          <div style=\"width:48px;height:48px;border-radius:14px;background:#F0F5F6;display:flex;align-items:center;justify-content:center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#006378\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M11 2v2\"><\u002Fpath><path d=\"M5 2v2\"><\u002Fpath><path d=\"M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1\"><\u002Fpath><path d=\"M8 15a6 6 0 0 0 6 6h1a3 3 0 0 0 3-3v-2\"><\u002Fpath><circle cx=\"20\" cy=\"10\" r=\"2\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n          <h3 style=\"margin-top:18px;font-size:18px;font-weight:700;color:#1F3A42\">PIATO Pflege<\u002Fh3>\n          <p style=\"margin-top:8px;font-size:15px;line-height:1.6;color:#5B6A70;text-wrap:pretty\">Anliegen priorisiert bearbeiten und rückmelden.<\u002Fp>\n          <a href=\"https://apps.apple.com/de/app/piato-pflege/id1638118718\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"margin-top:16px;display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:#006378\" style-hover=\"color:#00485A\">Im App Store laden\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m12 5 7 7-7 7\"><\u002Fpath><\u002Fsvg>\n          <\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"wirkung\" data-screen-label=\"Wirkung\" style=\"max-width:1240px;margin:0 auto;padding:104px 32px\">\n    <div data-reveal=\"\" style=\"max-width:760px;margin:0 auto;text-align:center\">\n      <span style=\"display:inline-block;background:#F0F5F6;color:#006378;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:11px 22px;border-radius:999px\">Messbare Wirkung<\u002Fspan>\n      <h2 style=\"margin-top:26px;font-size:clamp(28px,3.7vw,46px);line-height:1.14;letter-spacing:-.02em;font-weight:800;color:#006378;text-wrap:balance\">Messbare Wirkung im Pflegealltag<\u002Fh2>\n      <p style=\"margin-top:22px;font-size:clamp(17px,1.5vw,19px);line-height:1.65;color:#5B6A70;text-wrap:pretty\">PIATO Pflegeruf verbessert nicht nur die Kommunikation, sondern wirkt direkt auf Abläufe, Zeit und Belastung im Alltag.<\u002Fp>\n    <\u002Fdiv>\n    <div data-grid=\"4\" style=\"margin-top:56px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px\">\n      <div data-reveal=\"\" style=\"background:#fff;border:1px solid #E7ECEE;border-radius:20px;padding:38px 30px;text-align:center;transition:transform .25s ease,box-shadow .25s ease\" style-hover=\"transform:translateY(-5px);box-shadow:0 20px 44px -22px rgba(0,60,75,.32)\">\n        <p style=\"font-size:clamp(26px,2.6vw,34px);font-weight:800;color:#006378;letter-spacing:-.02em\">bis zu 35 %<\u002Fp>\n        <p style=\"margin-top:12px;font-size:16px;line-height:1.55;color:#5B6A70\">weniger Laufwege im Pflegealltag<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" data-reveal-delay=\"90\" style=\"background:#fff;border:1px solid #E7ECEE;border-radius:20px;padding:38px 30px;text-align:center;transition:transform .25s ease,box-shadow .25s ease\" style-hover=\"transform:translateY(-5px);box-shadow:0 20px 44px -22px rgba(0,60,75,.32)\">\n        <p style=\"font-size:clamp(26px,2.6vw,34px);font-weight:800;color:#006378;letter-spacing:-.02em\">ca. 6 Minuten<\u002Fp>\n        <p style=\"margin-top:12px;font-size:16px;line-height:1.55;color:#5B6A70\">Zeitersparnis pro Ruf<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" data-reveal-delay=\"180\" style=\"background:#fff;border:1px solid #E7ECEE;border-radius:20px;padding:38px 30px;text-align:center;transition:transform .25s ease,box-shadow .25s ease\" style-hover=\"transform:translateY(-5px);box-shadow:0 20px 44px -22px rgba(0,60,75,.32)\">\n        <p style=\"font-size:clamp(26px,2.6vw,34px);font-weight:800;color:#006378;letter-spacing:-.02em\">klarere<\u002Fp>\n        <p style=\"margin-top:12px;font-size:16px;line-height:1.55;color:#5B6A70\">Priorisierung von Anliegen<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" data-reveal-delay=\"270\" style=\"background:#fff;border:1px solid #E7ECEE;border-radius:20px;padding:38px 30px;text-align:center;transition:transform .25s ease,box-shadow .25s ease\" style-hover=\"transform:translateY(-5px);box-shadow:0 20px 44px -22px rgba(0,60,75,.32)\">\n        <p style=\"font-size:clamp(26px,2.6vw,34px);font-weight:800;color:#006378;letter-spacing:-.02em\">weniger<\u002Fp>\n        <p style=\"margin-top:12px;font-size:16px;line-height:1.55;color:#5B6A70\">Unterbrechungen im Pflegeprozess<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:36px auto 0;max-width:760px;text-align:center;font-size:16px;line-height:1.6;color:#7A868B;text-wrap:pretty\">Diese Effekte entstehen durch strukturierte, nachvollziehbare Kommunikation zwischen Patient:innen und Pflege.<\u002Fp>\n    <div data-grid=\"2\" style=\"margin-top:56px;display:grid;grid-template-columns:1fr 1fr;gap:28px\">\n      <div data-reveal=\"\" style=\"background:#fff;border:1px solid #E7ECEE;border-radius:22px;padding:40px\">\n        <h3 style=\"font-size:24px;font-weight:700;color:#006378;letter-spacing:-.01em\">Für die Pflege<\u002Fh3>\n        <ul style=\"margin-top:22px;display:grid;gap:14px\">\n          <li style=\"display:flex;gap:12px;align-items:flex-start;font-size:17px;line-height:1.55;color:#5B6A70\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#006378\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:0 0 auto;margin-top:3px\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>bessere Übersicht über alle Anfragen<\u002Fli>\n          <li style=\"display:flex;gap:12px;align-items:flex-start;font-size:17px;line-height:1.55;color:#5B6A70\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#006378\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:0 0 auto;margin-top:3px\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>gezielte Weitergabe im Team<\u002Fli>\n          <li style=\"display:flex;gap:12px;align-items:flex-start;font-size:17px;line-height:1.55;color:#5B6A70\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#006378\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:0 0 auto;margin-top:3px\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>spürbare Entlastung im Alltag<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div data-reveal=\"\" data-reveal-delay=\"110\" style=\"background:#fff;border:1px solid #E7ECEE;border-radius:22px;padding:40px\">\n        <h3 style=\"font-size:24px;font-weight:700;color:#006378;letter-spacing:-.01em\">Für Patient:innen<\u002Fh3>\n        <ul style=\"margin-top:22px;display:grid;gap:14px\">\n          <li style=\"display:flex;gap:12px;align-items:flex-start;font-size:17px;line-height:1.55;color:#5B6A70\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#006378\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:0 0 auto;margin-top:3px\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>wissen, dass ihr Anliegen angekommen ist<\u002Fli>\n          <li style=\"display:flex;gap:12px;align-items:flex-start;font-size:17px;line-height:1.55;color:#5B6A70\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#006378\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:0 0 auto;margin-top:3px\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>fühlen sich ernst genommen<\u002Fli>\n          <li style=\"display:flex;gap:12px;align-items:flex-start;font-size:17px;line-height:1.55;color:#5B6A70\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#006378\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:0 0 auto;margin-top:3px\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>mehr Sicherheit im Versorgungsprozess<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"funktionen\" data-screen-label=\"Funktionen\" style=\"background:#F5F7F8\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:100px 32px\">\n      <div data-reveal=\"\" style=\"max-width:760px;margin:0 auto;text-align:center\">\n        <span style=\"display:inline-block;background:#fff;color:#006378;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:11px 22px;border-radius:999px\">Funktionen<\u002Fspan>\n        <h2 style=\"margin-top:26px;font-size:clamp(28px,3.7vw,46px);line-height:1.14;letter-spacing:-.02em;font-weight:800;color:#006378;text-wrap:balance\">Was PIATO Pflegeruf ermöglicht<\u002Fh2>\n      <\u002Fdiv>\n      <div data-grid=\"3\" style=\"margin-top:56px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px\">\n        <article data-reveal=\"\" style=\"background:#fff;border:1px solid #E7ECEE;border-radius:22px;padding:36px;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease\" style-hover=\"transform:translateY(-5px);box-shadow:0 22px 46px -24px rgba(0,60,75,.34);border-color:#CFE0E4\">\n          <div style=\"width:52px;height:52px;border-radius:16px;background:#F0F5F6;display:flex;align-items:center;justify-content:center\"><svg width=\"24\" height=\"24\" sc-camel ,.34);border-color:#CFE0E4\">\n          <div style=\"width:52px;height:52px;border-radius:16px;background:#F0F5F6;display:flex;align-items:center;justify-content:center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#006378\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"><\u002Fpath><path d=\"M12 9v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <h3 style=\"margin-top:24px;font-size:21px;font-weight:700;color:#1F3A42\">Weniger Missverständnisse<\u002Fh3>\n          <p style=\"margin-top:12px;font-size:16px;line-height:1.62;color:#5B6A70;text-wrap:pretty\">Klare Kategorien reduzieren Rückfragen, Fehlwege und Fehlerquellen im Team.<\u002Fp>\n        <\u002Farticle>\n        <article data-reveal=\"\" style=\"background:#fff;border:1px solid #E7ECEE;border-radius:22px;padding:36px;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease\" style-hover=\"transform:translateY(-5px);box-shadow:0 22px 46px -24px rgba(0,60,75,.34);border-color:#CFE0E4\">\n          <div style=\"width:52px;height:52px;border-radius:16px;background:#F0F5F6;display:flex;align-items:center;justify-content:center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#006378\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <h3 style=\"margin-top:24px;font-size:21px;font-weight:700;color:#1F3A42\">Höhere Pflegequalität<\u002Fh3>\n          <p style=\"margin-top:12px;font-size:16px;line-height:1.62;color:#5B6A70;text-wrap:pretty\">Weniger Wege, weniger Lärm, weniger Stress – und mehr Aufmerksamkeit am Bett.< \u002Fpath><\u002Fsvg><\u002Fdiv>\n          <h3 style=\"margin-top:24px;font-size:21px;font-weight:700;color:#1F3A42\">Digitale Dialogkultur<\u002Fh3>\n          <p style=\"margin-top:12px;font-size:16px;line-height:1.62;color:#5B6A70;text-wrap:pretty\">Ein System, das Pflege, Patient:innen und Angehörige wertschätzend einbindet.<\u002Fp>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"dokumentation\" data-screen-label=\"Dokumentation\" style=\"max-width:1240px;margin:0 auto;padding:104px 32px\">\n    <div data-reveal=\"\" data-pad=\"\" style=\"background:#F0F5F6;border-radius:28px;padding:64px 56px\">\n      <div style=\"max-width:760px\">\n        <span style=\"display:inline-block;background:#fff;color:#006378;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:11px 22px;border-radius:999px\">Ereignisse &amp; Dokumentation<\u002Fspan>\n        <h2 style=\"margin-top:26px;font-size:clamp(26px,3.2vw,40px);line-height:1.16;letter-spacing:-.02em;font-weight:800;color:#006378;text-wrap:balance\">Nachvollziehbar statt auf Papier<\u002Fh2>\n        <p style=\"margin-top:22px;font-size:clamp(17px,1.5vw,19px);line-height:1.65;color:#5B6A70;text-wrap:pretty\">Bearbeitung und Abschluss eines Anliegens sind für alle Beteiligten nachvollziehbar – lückenlos dokumentiert und auswertbar. Das reduziert den Dokumentationsaufwand auf Papier und macht Abläufe im Team überprüfbar.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:16px;margin-top:32px\">\n        <a href=\"../einsatzbereiche/\" style=\"min-height:52px;display:inline-flex;align-items:center;background:#fff;color:#1F3A42;font-size:16px;font-weight:600;padding:17px 32px;border-radius:999px;border:1px solid #DFE3E5;transition:border-color .2s ease,color .2s ease\" style-hover=\"border-color:#006378;color:#006378\">Einsatzbereiche entdecken<\u002Fa>\n        <a href=\"../contact/\" style=\"min-height:52px;disp
